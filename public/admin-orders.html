<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Commandes - DiamanoSN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; padding: 20px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        .order-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .order-id { font-weight: bold; color: #667eea; }
        .badge { display: inline-block; padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-pending_payment { background: #fed7d7; color: #c53030; }
        .badge-pending { background: #fed7d7; color: #c53030; }
        .badge-confirmed { background: #c6f6d5; color: #22543d; }
        .badge-shipped { background: #bfdbfe; color: #1e40af; }
        .badge-delivered { background: #e9d5ff; color: #6b21a8; }
        .badge-cancelled { background: #fecaca; color: #991b1b; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.3s; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-secondary { background: #ddd; color: #333; }
        .btn-secondary:hover { background: #ccc; }
        .order-items { margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 5px; }
        .order-items table { width: 100%; font-size: 12px; }
        .order-items th { text-align: left; padding: 5px; font-weight: bold; border-bottom: 1px solid #ddd; }
        .order-items td { padding: 5px; }
        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 20px; color: #333; }
        select, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; font-family: Arial, sans-serif; }
        textarea { resize: vertical; min-height: 80px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .modal-buttons button { flex: 1; }
        .alert { padding: 15px; border-radius: 5px; margin-bottom: 15px; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .loading { display: none; text-align: center; padding: 20px; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .order-details { margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 5px; font-size: 13px; }
        .order-details p { margin: 5px 0; }
        .order-details strong { color: #667eea; }
        .filter-bar { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-bar select { padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 Gestion des Commandes</h1>
        <button class="btn btn-secondary" onclick="location.href='/admin-advanced.html'">← Retour</button>
    </div>

    <div class="container">
        <div id="alertContainer"></div>
        
        <div class="filter-bar">
            <select id="filterStatus" onchange="applyFilter()">
                <option value="">Tous les statuts</option>
                <option value="pending">⏳ En attente</option>
                <option value="pending_payment">⏳ En attente paiement</option>
                <option value="confirmed">✅ Confirmée</option>
                <option value="shipped">📦 Expédiée</option>
                <option value="delivered">✓ Livrée</option>
                <option value="cancelled">❌ Annulée</option>
            </select>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Chargement des commandes...</p>
        </div>

        <div id="ordersContainer"></div>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3>Modifier le Statut de la Commande</h3>
            
            <div id="orderInfo" style="background: #f0f4ff; padding: 15px; border-radius: 5px; margin-bottom: 15px;">
                <p><strong>Commande:</strong> <span id="modalOrderRef"></span></p>
                <p><strong>Client:</strong> <span id="modalCustomerName"></span></p>
                <p><strong>Email:</strong> <span id="modalCustomerEmail"></span></p>
                <p><strong>Montant:</strong> <span id="modalTotalAmount"></span> FCFA</p>
            </div>

            <label for="statusSelect"><strong>Nouveau Statut:</strong></label>
            <select id="statusSelect">
                <option value="">-- Sélectionnez un statut --</option>
                <option value="pending">⏳ En attente</option>
                <option value="pending_payment">⏳ En attente de paiement</option>
                <option value="confirmed">✅ Confirmée - En cours de préparation</option>
                <option value="shipped">📦 Expédiée - En route</option>
                <option value="delivered">✓ Livrée</option>
                <option value="cancelled">❌ Annulée</option>
            </select>

            <label for="notesField"><strong>Notes pour le suivi (optionnel):</strong></label>
            <textarea id="notesField" placeholder="Ex: Numéro de suivi, instructions de livraison, etc."></textarea>

            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="saveOrderChanges()">💾 Enregistrer et Notifier</button>
                <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
        import { getFirestore, collection, query, orderBy, getDocs, updateDoc, doc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBbFsuwlSpWjGKYK77HP3M065KdN2PN32Y",
            authDomain: "diamanosn-ea0a1.firebaseapp.com",
            projectId: "diamanosn-ea0a1",
            storageBucket: "diamanosn-ea0a1.firebasestorage.app",
            messagingSenderId: "480059418031",
            appId: "1:480059418031:web:bb071481468f52202e3b5a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let currentOrderId = null;
        let allOrders = [];

        onAuthStateChanged(auth, async user => {
            if (!user) {
                window.location.href = '/admin-login.html';
            } else {
                // Vérifier le token Firebase
                const token = await user.getIdToken();
                sessionStorage.setItem('firebaseToken', token);
                loadOrders();
            }
        });

        window.loadOrders = async function() {
            try {
                document.getElementById('loading').style.display = 'block';
                const q = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));
                const querySnapshot = await getDocs(q);
                allOrders = [];
                querySnapshot.forEach(docSnap => {
                    allOrders.push({id: docSnap.id, ...docSnap.data()});
                });
                document.getElementById('loading').style.display = 'none';
                applyFilter();
            } catch (error) {
                console.error('Erreur chargement:', error);
                showAlert('Erreur lors du chargement des commandes: ' + error.message, 'error');
                document.getElementById('loading').style.display = 'none';
            }
        };

        window.applyFilter = function() {
            const filter = document.getElementById('filterStatus').value;
            let filtered = allOrders;
            if (filter) {
                filtered = allOrders.filter(o => o.status === filter);
            }
            displayOrders(filtered);
        };

        window.displayOrders = function(orders) {
            let html = '';
            if (orders.length === 0) {
                html = '<p style="text-align: center; color: #999; padding: 40px;">Aucune commande trouvée</p>';
            } else {
                html = orders.map(order => {
                    const date = order.createdAt ? new Date(order.createdAt.seconds ? order.createdAt.seconds * 1000 : order.createdAt).toLocaleDateString('fr') : '-';
                    const totalDisplay = order.totalAmount || order.totalPrice || 0;
                    return `
                        <div class="order-card">
                            <div class="order-header">
                                <div>
                                    <div class="order-id">📦 ${order.orderRef || 'Commande #' + order.id.substring(0, 8)}</div>
                                    <div style="color: #666; font-size: 13px;">${order.customerEmail || order.userEmail || '-'} • ${date}</div>
                                </div>
                                <div style="display: flex; gap: 10px; align-items: center;">
                                    <span class="badge badge-${order.status || 'pending'}">${getStatusLabel(order.status)}</span>
                                    <button class="btn btn-primary" onclick="editOrder('${order.id}', '${order.status}', '${(order.notes || '').replace(/"/g, '&quot;')}')">✏️ Modifier</button>
                                </div>
                            </div>

                            <div class="order-details">
                                <p><strong>Client:</strong> ${order.customerName || 'N/A'}</p>
                                <p><strong>Montant:</strong> ${totalDisplay.toLocaleString('fr-SN')} FCFA</p>
                                <p><strong>Adresse:</strong> ${order.address || 'Non spécifiée'}</p>
                                <p><strong>Méthode:</strong> ${order.paymentMethod === 'senepay' ? '💳 SenePay' : '🚚 À la livraison'}</p>
                                ${order.notes ? `<p><strong>Notes:</strong> ${order.notes}</p>` : ''}
                            </div>

                            ${order.items && order.items.length > 0 ? `
                                <div class="order-items">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Produit</th>
                                                <th style="text-align: center;">Qté</th>
                                                <th style="text-align: right;">Prix</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${order.items.map(item => `
                                                <tr>
                                                    <td>${item.name || 'Produit'}</td>
                                                    <td style="text-align: center;">${item.qty || 1}</td>
                                                    <td style="text-align: right;">${((item.price || 0) * (item.qty || 1)).toLocaleString('fr-SN')} FCFA</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            }
            document.getElementById('ordersContainer').innerHTML = html;
        };

        window.editOrder = function(id, status, notes) {
            currentOrderId = id;
            const order = allOrders.find(o => o.id === id);
            if (order) {
                document.getElementById('modalOrderRef').textContent = order.orderRef || order.id.substring(0, 8);
                document.getElementById('modalCustomerName').textContent = order.customerName || 'N/A';
                document.getElementById('modalCustomerEmail').textContent = order.customerEmail || order.userEmail || '-';
                document.getElementById('modalTotalAmount').textContent = (order.totalAmount || order.totalPrice || 0).toLocaleString('fr-SN');
                document.getElementById('statusSelect').value = status || '';
                document.getElementById('notesField').value = notes || '';
                document.getElementById('orderModal').classList.add('active');
            }
        };

        window.saveOrderChanges = async function() {
            const newStatus = document.getElementById('statusSelect').value;
            const notes = document.getElementById('notesField').value;

            if (!newStatus) {
                showAlert('Veuillez sélectionner un statut', 'error');
                return;
            }

            try {
                const token = sessionStorage.getItem('firebaseToken');
                
                // Appel au backend API (URL absolue vers Render)
                const response = await fetch(`https://diamonobackend.onrender.com/api/admin/orders/${currentOrderId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        status: newStatus,
                        notes: notes
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('✅ Commande mise à jour! Email envoyé au client.', 'success');
                    closeModal();
                    loadOrders();
                } else {
                    showAlert(`Erreur: ${result.error || 'Erreur inconnue'}`, 'error');
                }
            } catch (error) {
                console.error('Erreur:', error);
                showAlert('Erreur lors de la mise à jour: ' + error.message, 'error');
            }
        };

        window.closeModal = function() {
            document.getElementById('orderModal').classList.remove('active');
        };

        function getStatusLabel(status) {
            const labels = {
                'pending': '⏳ En attente',
                'pending_payment': '⏳ En attente paiement',
                'confirmed': '✅ Confirmée',
                'shipped': '📦 Expédiée',
                'delivered': '✓ Livrée',
                'cancelled': '❌ Annulée'
            };
            return labels[status] || status;
        }

        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);
            
            if (type === 'success') {
                setTimeout(() => alert.remove(), 4000);
            }
        }

        // Fermer le modal en cliquant en dehors
        document.getElementById('orderModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('orderModal')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
