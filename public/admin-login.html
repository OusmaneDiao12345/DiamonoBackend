<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - DiamanoSN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-box {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            text-align: center;
        }

        .login-logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .login-title {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .login-subtitle {
            color: #999;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: block;
            font-size: 14px;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }

        .form-control:hover {
            border-color: var(--primary);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            color: white;
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .login-divider {
            text-align: center;
            margin: 30px 0;
            color: #999;
            font-size: 14px;
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            display: inline-block;
            width: 40%;
            height: 1px;
            background: #ddd;
            vertical-align: middle;
        }

        .login-divider::before {
            margin-right: 10px;
        }

        .login-divider::after {
            margin-left: 10px;
        }

        .btn-google {
            border: 2px solid #ddd;
            color: #333;
            background: white;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google:hover {
            border-color: var(--primary);
            background: #f8f8f8;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 15px 0;
            font-size: 14px;
        }

        .remember-me input {
            cursor: pointer;
        }

        .forgot-password {
            text-align: right;
            margin: 15px 0;
        }

        .forgot-password a {
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #999;
        }

        .signup-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 8px;
            border: none;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .loading-spinner {
            display: none;
        }

        .field-icon {
            position: relative;
        }

        .field-icon i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            cursor: pointer;
        }

        .form-control + i {
            position: absolute;
            right: 12px;
            top: 38px;
            color: #999;
            cursor: pointer;
        }

        @media (max-width: 576px) {
            .login-box {
                padding: 30px 20px;
            }

            .login-title {
                font-size: 22px;
            }

            .login-subtitle {
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div style="position: absolute; top: 20px; left: 20px;">
            <a href="https://diamanosn.netlify.app" target="_blank" class="btn btn-light btn-sm" title="Retour à la boutique">
                <i class="bi bi-arrow-left"></i> Retour à la Boutique
            </a>
        </div>
        <div class="login-box">
            <div class="login-logo">
                <i class="bi bi-gem" style="color: var(--primary);"></i>
            </div>
            <div class="login-title">DiamanoSN</div>
            <div class="login-subtitle">Admin Dashboard</div>

            <!-- Alert Container -->
            <div id="alertContainer"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <!-- Email -->
                <div class="form-group">
                    <label class="form-label"><i class="bi bi-envelope"></i> Email</label>
                    <input 
                        type="email" 
                        class="form-control" 
                        id="email" 
                        placeholder="admin@diamanosn.com"
                        required
                    >
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label"><i class="bi bi-lock"></i> Mot de passe</label>
                    <div class="field-icon">
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            placeholder="••••••••"
                            required
                        >
                        <i class="bi bi-eye" id="togglePassword" onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe" style="margin: 0;">Se souvenir de moi</label>
                    </div>
                    <a href="#" class="forgot-password" onclick="resetPassword(); return false;">Mot de passe oublié?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="loginText">Connexion</span>
                    <span id="loadingSpinner" class="loading-spinner" style="display: inline-block;">
                        <i class="bi bi-hourglass-split"></i>
                    </span>
                </button>
            </form>

            <!-- Divider -->
            <div class="login-divider">ou</div>

            <!-- Google Login -->
            <button class="btn-google" id="googleBtn" onclick="loginWithGoogle()">
                <i class="bi bi-google"></i> Se connecter avec Google
            </button>

            <!-- Admin Credentials Info -->
            <div style="background: #f0f4ff; border-radius: 8px; padding: 15px; margin-top: 25px; font-size: 12px; color: #666;">
                <strong style="color: var(--primary);"><i class="bi bi-info-circle"></i> Identifiants de démo :</strong>
                <div style="margin-top: 8px;">
                    Email: <code>admin@diamanosn.com</code><br>
                    Password: <code>Admin@123</code>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Firebase SDK (Compat version for HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>

    <script>
        // ==================== FIREBASE CONFIG ====================
        let firebaseConfig = null;
        let auth = null;

        // Fetch Firebase config from server
        async function loadFirebaseConfig() {
            try {
                const response = await fetch('/api/config/firebase');
                firebaseConfig = await response.json();
                console.log('✅ Firebase config loaded:', firebaseConfig.projectId);
                
                // Initialize Firebase after config is loaded
                try {
                    firebase.initializeApp(firebaseConfig);
                    auth = firebase.auth();
                    console.log('✅ Firebase initialized successfully');
                    
                    // Check if user is already logged in
                    if (auth) {
                        auth.onAuthStateChanged(user => {
                            if (user) {
                                window.location.href = './admin-dashboard.html';
                            }
                        });
                    }
                } catch (error) {
                    console.error('❌ Firebase initialization error:', error);
                    showAlert('Erreur d\'initialisation Firebase', 'danger');
                }
            } catch (error) {
                console.error('❌ Error loading Firebase config:', error);
                showAlert('Erreur lors du chargement de la configuration Firebase', 'danger');
            }
        }

        // Load config when page loads
        document.addEventListener('DOMContentLoaded', loadFirebaseConfig);

        // ==================== LOGIN FUNCTION ====================
        async function handleLogin(event) {
            event.preventDefault();

            if (!auth) {
                showAlert('Firebase n\'est pas chargé. Veuillez rafraîchir la page.', 'danger');
                return;
            }

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginText = document.getElementById('loginText');
            const loadingSpinner = document.getElementById('loadingSpinner');

            if (!email || !password) {
                showAlert('Veuillez remplir tous les champs', 'warning');
                return;
            }

            try {
                loginBtn.disabled = true;
                loginText.style.display = 'none';
                loadingSpinner.style.display = 'inline-block';

                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                
                // Check if user is admin (you can add admin check logic here)
                showAlert('Connexion réussie!', 'success');
                
                setTimeout(() => {
                    window.location.href = './admin-dashboard.html';
                }, 1000);

            } catch (error) {
                loginBtn.disabled = false;
                loginText.style.display = 'inline';
                loadingSpinner.style.display = 'none';

                console.error('Login error:', error);
                
                let message = 'Erreur lors de la connexion';
                if (error.code === 'auth/user-not-found') {
                    message = 'Utilisateur non trouvé';
                } else if (error.code === 'auth/wrong-password') {
                    message = 'Mot de passe incorrect';
                } else if (error.code === 'auth/invalid-email') {
                    message = 'Email invalide';
                } else if (error.code === 'auth/too-many-requests') {
                    message = 'Trop de tentatives. Veuillez réessayer plus tard';
                }
                
                showAlert(message, 'danger');
            }
        }

        // ==================== GOOGLE LOGIN ====================
        async function loginWithGoogle() {
            if (!auth) {
                showAlert('Firebase n\'est pas chargé. Veuillez rafraîchir la page.', 'danger');
                return;
            }

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                
                showAlert('Connexion Google réussie!', 'success');
                setTimeout(() => {
                    window.location.href = './admin-dashboard.html';
                }, 1000);
            } catch (error) {
                console.error('Google login error:', error);
                showAlert('Erreur lors de la connexion Google', 'danger');
            }
        }

        // ==================== UTILITIES ====================
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePassword');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('bi-eye');
                toggleIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('bi-eye-slash');
                toggleIcon.classList.add('bi-eye');
            }
        }

        function resetPassword() {
            if (!auth) {
                showAlert('Firebase n\'est pas chargé. Veuillez rafraîchir la page.', 'danger');
                return;
            }

            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showAlert('Veuillez entrer votre email', 'warning');
                return;
            }

            auth.sendPasswordResetEmail(email)
                .then(() => {
                    showAlert('Email de réinitialisation envoyé à ' + email, 'success');
                })
                .catch(error => {
                    console.error('Password reset error:', error);
                    showAlert('Erreur lors de l\'envoi du lien de réinitialisation', 'danger');
                });
        }

        function showAlert(message, type = 'info') {
            const alertId = 'alert-' + Date.now();
            let icon = '';
            let title = '';

            switch(type) {
                case 'success': icon = 'bi-check-circle'; title = 'Succès'; break;
                case 'danger': icon = 'bi-exclamation-circle'; title = 'Erreur'; break;
                case 'warning': icon = 'bi-exclamation-triangle'; title = 'Attention'; break;
                default: icon = 'bi-info-circle'; title = 'Info';
            }

            const alertHTML = `
                <div id="${alertId}" class="alert alert-${type} alert-dismissible fade show" role="alert">
                    <i class="bi ${icon}"></i>
                    <strong>${title}!</strong> ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;

            document.getElementById('alertContainer').insertAdjacentHTML('beforeend', alertHTML);
            
            setTimeout(() => {
                const alert = document.getElementById(alertId);
                if (alert) alert.remove();
            }, 5000);
        }

        // Demo credentials on load
        document.addEventListener('DOMContentLoaded', () => {
            const remembered = localStorage.getItem('rememberMe');
            if (remembered) {
                document.getElementById('email').value = localStorage.getItem('userEmail');
                document.getElementById('rememberMe').checked = true;
            }
        });

        // Save remember me preference
        document.getElementById('rememberMe').addEventListener('change', (e) => {
            const email = document.getElementById('email').value;
            if (e.target.checked) {
                localStorage.setItem('rememberMe', 'true');
                localStorage.setItem('userEmail', email);
            } else {
                localStorage.removeItem('rememberMe');
                localStorage.removeItem('userEmail');
            }
        });
    </script>
</body>
</html>
